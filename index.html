<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Sanctum Monster Manual</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

<style>
:root{
  --bg-deep:#08090d;
  --bg-mid:#0e1018;
  --bg-surface:#141620;
  --gold:#C9A96E;
  --gold-dim:#8B7040;
  --gold-light:#E8D5A8;
  --text-primary:#ccd6e8;
  --text-muted:#a3b3c7;
  --text-faint:#6b7d94;
  --border-dim:rgba(201,169,110,.18);
  --border-mid:rgba(201,169,110,.35);
  --shadow:0 26px 80px rgba(0,0,0,.62);
  --paper-red:#7d241e;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 900px 440px at 50% -10%,rgba(80,120,200,.1),transparent 60%),
    radial-gradient(ellipse 650px 360px at 15% 20%,rgba(201,169,110,.08),transparent 65%),
    linear-gradient(180deg,var(--bg-deep),#05060a);
  color:var(--text-primary);
  font-family:'Crimson Pro',Georgia,serif;
  font-size:18px;
  line-height:1.55;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(201,169,110,.03) 1px, transparent 1px),
    linear-gradient(90deg,rgba(201,169,110,.025) 1px, transparent 1px);
  background-size:56px 56px;
  opacity:.32;
  mask-image:radial-gradient(circle at 50% 8%,#000,transparent 82%);
}

.manual-shell{
  width:min(1240px,calc(100% - 32px));
  margin:0 auto;
  padding:42px 0 72px;
}

.header{
  border:1px solid var(--border-mid);
  background:linear-gradient(180deg,rgba(20,22,32,.92),rgba(8,9,13,.96));
  padding:34px 24px;
  text-align:center;
  box-shadow:0 0 44px rgba(201,169,110,.09);
  margin-bottom:18px;
  position:relative;
}

.header::before,.header::after{
  content:"✦";
  position:absolute;
  top:14px;
  color:var(--gold-dim);
}

.header::before{left:16px}
.header::after{right:16px}

.kicker{
  font-family:'Cinzel',serif;
  text-transform:uppercase;
  letter-spacing:.32em;
  color:var(--gold-dim);
  font-size:11px;
  margin-bottom:10px;
}

h1{
  font-family:'Cinzel Decorative',serif;
  color:var(--gold-light);
  font-size:clamp(34px,5vw,62px);
  letter-spacing:.04em;
  line-height:1.1;
  text-shadow:0 0 36px rgba(201,169,110,.25);
}

.subtitle{
  font-family:'Cinzel',serif;
  text-transform:uppercase;
  letter-spacing:.23em;
  color:var(--text-faint);
  font-size:12px;
  margin-top:10px;
}

.divider{
  width:min(380px,70vw);
  height:1px;
  margin:20px auto;
  background:linear-gradient(90deg,transparent,var(--gold-dim),var(--gold-light),var(--gold-dim),transparent);
}

.help{
  max-width:820px;
  margin:0 auto;
  color:var(--text-muted);
  font-style:italic;
}

.controls{
  border:1px solid var(--border-dim);
  background:rgba(11,12,19,.88);
  padding:14px;
  margin-bottom:18px;
  display:grid;
  grid-template-columns:1.4fr .8fr .8fr .7fr;
  gap:10px;
}

.search-input,
.filter-select{
  width:100%;
  border:1px solid var(--border-mid);
  background:#090b10;
  color:var(--gold-light);
  padding:11px 12px;
  font-family:'Cinzel',serif;
  font-size:12px;
  letter-spacing:.08em;
}

.search-input::placeholder{
  color:rgba(232,213,168,.42);
}

.counter{
  border:1px solid var(--border-dim);
  background:rgba(5,6,10,.6);
  color:var(--text-muted);
  padding:11px 12px;
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.monster-card{
  border:1px solid var(--border-mid);
  background:
    radial-gradient(ellipse 420px 220px at 50% 0%,rgba(201,169,110,.12),transparent 70%),
    linear-gradient(180deg,rgba(20,22,32,.94),rgba(8,9,13,.98));
  box-shadow:var(--shadow);
  padding:18px;
  min-height:260px;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}

.monster-card::before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(201,169,110,.10);
  pointer-events:none;
}

.card-kicker{
  font-family:'Cinzel',serif;
  text-transform:uppercase;
  letter-spacing:.22em;
  color:var(--gold-dim);
  font-size:10px;
  margin-bottom:8px;
}

.card-title{
  font-family:'Cinzel Decorative',serif;
  color:var(--gold-light);
  font-size:28px;
  line-height:1.05;
  margin-bottom:8px;
}

.card-type{
  color:var(--text-muted);
  font-style:italic;
  margin-bottom:14px;
}

.card-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
}

.badge{
  border:1px solid rgba(201,169,110,.28);
  color:var(--gold-light);
  background:rgba(201,169,110,.06);
  padding:5px 8px;
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.card-description{
  color:var(--text-muted);
  margin-bottom:18px;
  flex:1;
}

.card-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:auto;
}

.btn{
  border:1px solid var(--border-mid);
  background:linear-gradient(180deg,rgba(20,22,32,.95),rgba(8,9,13,.98));
  color:var(--gold-light);
  padding:10px 13px;
  cursor:pointer;
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  text-decoration:none;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  transition:.18s ease;
}

.btn:hover{
  border-color:var(--gold);
  box-shadow:0 0 18px rgba(201,169,110,.12);
}

.empty{
  grid-column:1/-1;
  border:1px solid var(--border-dim);
  background:rgba(11,12,19,.88);
  padding:30px;
  text-align:center;
  color:var(--text-muted);
  font-style:italic;
}

.viewer{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  background:rgba(0,0,0,.84);
  padding:22px;
}

.viewer.active{
  display:flex;
  flex-direction:column;
}

.viewer-bar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
}

.viewer-title{
  font-family:'Cinzel',serif;
  color:var(--gold-light);
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:12px;
}

.viewer iframe{
  width:100%;
  height:100%;
  border:1px solid var(--border-mid);
  background:#05060a;
  box-shadow:var(--shadow);
}

@media(max-width:1000px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .controls{grid-template-columns:1fr 1fr}
}

@media(max-width:640px){
  .manual-shell{width:calc(100% - 18px);padding:20px 0 42px}
  .grid{grid-template-columns:1fr}
  .controls{grid-template-columns:1fr}
  .header{padding:28px 16px}
}
</style>
</head>

<body>
<div class="manual-shell">

  <header class="header">
    <div class="kicker">The Sanctum Archive</div>
    <h1>Monster Manual</h1>
    <div class="subtitle">Indexed Custom Creatures · Lore · Stat Blocks · Encounter Relics</div>
    <div class="divider"></div>
    <p class="help">
      Search the archive, filter by category or challenge rating, and open each creature’s full Sanctum codex.
    </p>
  </header>

  <section class="controls">
    <input id="searchInput" class="search-input" type="search" placeholder="Search monsters..." />

    <select id="categoryFilter" class="filter-select">
      <option value="">All Categories</option>
    </select>

    <select id="crFilter" class="filter-select">
      <option value="">All CR</option>
      <option value="0-4">CR 0–4</option>
      <option value="5-10">CR 5–10</option>
      <option value="11-16">CR 11–16</option>
      <option value="17-30">CR 17–30</option>
    </select>

    <div id="counter" class="counter">0 Monsters</div>
  </section>

  <main id="monsterGrid" class="grid"></main>

</div>

<div id="viewer" class="viewer" aria-hidden="true">
  <div class="viewer-bar">
    <div id="viewerTitle" class="viewer-title">Monster Codex</div>
    <button id="closeViewer" class="btn" type="button">Close</button>
  </div>
  <iframe id="viewerFrame" title="Monster Codex Viewer"></iframe>
</div>

<script>
const SAMPLE_MONSTERS = [
  {
    name: "The Saint's Residue",
    category: "Undead",
    type: "Large Undead (Aberration)",
    cr: 13,
    tags: ["Boss", "Necrotic", "Sanctum"],
    url: "monsters/saints-residue.html",
    description: "A corrupted relic of faith and undeath, preserved as a full Sanctum codex entry."
  }
];

let monsters = [];
let filtered = [];

const grid = document.getElementById("monsterGrid");
const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
const crFilter = document.getElementById("crFilter");
const counter = document.getElementById("counter");

const viewer = document.getElementById("viewer");
const viewerFrame = document.getElementById("viewerFrame");
const viewerTitle = document.getElementById("viewerTitle");
const closeViewer = document.getElementById("closeViewer");

async function loadMonsters(){
  try{
    const response = await fetch("monsters.json", { cache: "no-store" });
    if(!response.ok) throw new Error("monsters.json not found");
    monsters = await response.json();
  }catch(error){
    monsters = SAMPLE_MONSTERS;
    console.warn("Using sample monster data because monsters.json could not be loaded.", error);
  }

  buildCategoryFilter();
  applyFilters();
}

function buildCategoryFilter(){
  const categories = [...new Set(monsters.map(m => m.category).filter(Boolean))].sort();

  categories.forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    categoryFilter.appendChild(option);
  });
}

function applyFilters(){
  const query = searchInput.value.trim().toLowerCase();
  const category = categoryFilter.value;
  const crRange = crFilter.value;

  filtered = monsters.filter(monster => {
    const haystack = [
      monster.name,
      monster.category,
      monster.type,
      monster.description,
      ...(monster.tags || [])
    ].join(" ").toLowerCase();

    const matchesSearch = !query || haystack.includes(query);
    const matchesCategory = !category || monster.category === category;
    const matchesCR = !crRange || isCRInRange(Number(monster.cr), crRange);

    return matchesSearch && matchesCategory && matchesCR;
  });

  renderMonsters();
}

function isCRInRange(cr, range){
  if(Number.isNaN(cr)) return false;

  const [min, max] = range.split("-").map(Number);
  return cr >= min && cr <= max;
}

function renderMonsters(){
  grid.innerHTML = "";

  counter.textContent = `${filtered.length} Monster${filtered.length === 1 ? "" : "s"}`;

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty">No monsters found in this part of the archive.</div>`;
    return;
  }

  filtered.forEach(monster => {
    const card = document.createElement("article");
    card.className = "monster-card";

    const tags = (monster.tags || [])
      .map(tag => `<span class="badge">${escapeHTML(tag)}</span>`)
      .join("");

    card.innerHTML = `
      <div class="card-kicker">${escapeHTML(monster.category || "Uncategorized")}</div>
      <h2 class="card-title">${escapeHTML(monster.name || "Unnamed Monster")}</h2>
      <div class="card-type">${escapeHTML(monster.type || "")}</div>

      <div class="card-meta">
        <span class="badge">CR ${escapeHTML(String(monster.cr ?? "?"))}</span>
        ${tags}
      </div>

      <p class="card-description">${escapeHTML(monster.description || "")}</p>

      <div class="card-actions">
        <button class="btn" type="button" data-open="${escapeHTML(monster.url)}" data-name="${escapeHTML(monster.name)}">Open Codex</button>
        <a class="btn" href="${escapeHTML(monster.url)}" target="_blank" rel="noopener">New Tab</a>
      </div>
    `;

    grid.appendChild(card);
  });
}

function openMonster(url, name){
  viewerTitle.textContent = name || "Monster Codex";
  viewerFrame.src = url;
  viewer.classList.add("active");
  viewer.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeMonster(){
  viewer.classList.remove("active");
  viewer.setAttribute("aria-hidden", "true");
  viewerFrame.src = "";
  document.body.style.overflow = "";
}

function escapeHTML(value){
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

grid.addEventListener("click", event => {
  const button = event.target.closest("[data-open]");
  if(!button) return;

  openMonster(button.dataset.open, button.dataset.name);
});

closeViewer.addEventListener("click", closeMonster);

viewer.addEventListener("click", event => {
  if(event.target === viewer) closeMonster();
});

document.addEventListener("keydown", event => {
  if(event.key === "Escape" && viewer.classList.contains("active")){
    closeMonster();
  }
});

searchInput.addEventListener("input", applyFilters);
categoryFilter.addEventListener("change", applyFilters);
crFilter.addEventListener("change", applyFilters);

loadMonsters();
</script>
</body>
</html>
